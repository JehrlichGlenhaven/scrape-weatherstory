<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSC Weather Channel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #001f3f;
      color: white;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .container {
      display: grid;
      grid-template-rows: 8vh 1fr 16vh;
      height: 100vh;
      width: 100vw;
      min-height: 480px;
    }
    .header {
      background: #00152e;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 1.5vw;
      border-bottom: 2px solid #004080;
      gap: 1vw;
    }
    .logo {
      height: clamp(45px, 6vh, 70px);
      width: auto;
      grid-column: 1;
      justify-self: start;
    }
    .header-title {
      grid-column: 2;
      justify-self: center;
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 1px;
    }
    .main {
      display: grid;
      grid-template-columns: minmax(280px, 26vw) 1fr;
      gap: 0;
      position: relative;
      min-height: 0;
    }
    .sidebar {
      background: #001a35;
      padding: 2vh 1.5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 2px solid #004080;
      min-height: 0;
      overflow: hidden;
    }
    .city-name { font-size: clamp(1.6rem, 2.8vw, 2.6rem); font-weight: 700; margin-bottom: 0.5vh; }
    .city-state { font-size: clamp(0.8rem, 1.1vw, 1.2rem); color: #88c0ff; margin-bottom: 2vh; text-transform: uppercase; letter-spacing: 1px; }
    .temp-main { font-size: clamp(3.5rem, 7.5vw, 6.5rem); font-weight: 300; line-height: 1; margin-bottom: 1vh; }
    .condition { font-size: clamp(1rem, 1.7vw, 1.7rem); color: #88c0ff; margin-bottom: 2.5vh; text-transform: capitalize; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 1vh 0;
      border-bottom: 1px solid #003366;
      font-size: clamp(0.85rem, 1.15vw, 1.15rem);
    }
    .detail-label { color: #88c0ff; }
    .map-container {
      position: relative;
      background: #757575;
      overflow: hidden;
      min-height: 0;
    }
    #radarMap {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .base-map-tile { filter: invert(1) grayscale(100%) brightness(2.5); }
    .radar-tile { filter: contrast(1.3) brightness(0.9); }
    .wx-image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 500;
      padding: 2vh 2vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
    }
    .wx-image-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .wx-image-overlay img {
      max-width: 100%;
      max-height: 90%;
      object-fit: contain;
      border: 3px solid #001f3f;
      background: #fff;
    }
    .wx-image-label {
      margin-top: 1vh;
      color: #001f3f;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      font-weight: 700;
      text-align: center;
    }
    .map-label {
      position: absolute;
      top: 1.5vh;
      right: 1.5vw;
      background: rgba(0,0,0,0.75);
      padding: 0.8vh 1vw;
      border-radius: 4px;
      font-size: clamp(0.7rem, 0.9vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 1000;
    }
    .radar-time {
      position: absolute;
      bottom: 1vh;
      left: 1vw;
      background: rgba(0,0,0,0.75);
      padding: 0.6vh 0.8vw;
      border-radius: 4px;
      font-size: clamp(0.7rem, 0.85vw, 0.85rem);
      color: #fff;
      z-index: 1000;
    }
    .update-time {
      position: absolute;
      bottom: 1vh;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.65rem, 0.75vw, 0.75rem);
      color: #88c0ff;
      background: rgba(0,0,0,0.6);
      padding: 0.5vh 0.6vw;
      border-radius: 4px;
      z-index: 1000;
    }
    .leaflet-control-attribution { font-size: clamp(8px, 0.6vw, 10px); }
    .ticker {
      background: #00152e;
      border-top: 2px solid #004080;
      padding: 1vh 1.5vw;
      display: flex;
      gap: clamp(8px, 1vw, 14px);
      overflow: hidden;
      min-height: 0;
    }
    .forecast-card {
      flex: 1 1 0;
      min-width: 0;
      background: #002a52;
      border-radius: 8px;
      padding: 1vh 0.6vw;
      text-align: center;
      border: 1px solid #004080;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .forecast-city {
      font-weight: 700;
      font-size: clamp(0.75rem, 1.05vw, 1.05rem);
      margin-bottom: 0.8vh;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .forecast-days {
      display: flex;
      gap: clamp(3px, 0.4vw, 6px);
      justify-content: center;
      flex: 1;
      min-height: 0;
    }
    .forecast-day {
      font-size: clamp(0.6rem, 0.8vw, 0.8rem);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .forecast-day-name { color: #88c0ff; margin-bottom: 0.3vh; }
    .forecast-icon { font-size: clamp(1rem, 1.6vw, 1.5rem); margin: 0.3vh 0; }
    .forecast-temps { font-size: clamp(0.6rem, 0.8vw, 0.8rem); line-height: 1.25; }
    .forecast-high { font-weight: 700; }
    .forecast-low { color: #88c0ff; }
    .loading { color: #88c0ff; font-style: italic; font-size: clamp(1rem, 1.3vw, 1.3rem); }
    .error { color: #ff9999; }

    /* Extra squeezed layouts */
    @media (max-aspect-ratio: 4/3) {
      .main { grid-template-columns: minmax(240px, 32vw) 1fr; }
      .temp-main { font-size: clamp(2.8rem, 6vw, 5rem); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="logo.png" alt="Glenhaven Snow Company" class="logo">
      <div class="header-title">GSC Weather Channel</div>
    </header>
    <main class="main">
      <aside class="sidebar" id="currentPanel">
        <div class="loading">Loading weather data...</div>
      </aside>
      <section class="map-container">
        <div class="map-label">Live Radar</div>
        <div id="radarMap"></div>
        <div class="wx-image-overlay" id="wxImageOverlay">
          <img id="wxImage" src="" alt="Weather Story">
          <div class="wx-image-label" id="wxImageLabel"></div>
        </div>
        <div class="radar-time" id="radarTime">Loading radar...</div>
        <div class="update-time" id="updateTime">Updated: --</div>
      </section>
    </main>
    <footer class="ticker" id="forecastTicker"></footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const cities = [
      { name: 'Glen Burnie', state: 'MD', lat: 39.1626, lon: -76.6247 },
      { name: 'Wilmington', state: 'DE', lat: 39.7391, lon: -75.5398 },
      { name: 'Philadelphia', state: 'PA', lat: 39.9526, lon: -75.1652 },
      { name: 'Toms River', state: 'NJ', lat: 39.9537, lon: -74.1979 },
      { name: 'Reading', state: 'PA', lat: 40.3356, lon: -75.9269 },
      { name: 'Blue Bell', state: 'PA', lat: 40.1695412, lon: -75.2507038 }
    ];

    // ===== RADAR SETUP =====
    // Seconds per radar frame. Larger = slower animation.
    const RADAR_FRAME_DELAY_MS = 1200;

    // Office location pin
    const OFFICE_LAT = 40.1695412;
    const OFFICE_LON = -75.2507038;

    const map = L.map('radarMap', {
      zoomControl: false,
      attributionControl: true
    });

    // Fit map from halfway up Virginia to the top of Pennsylvania
    map.fitBounds([[38.5, -77.5], [42.5, -73.5]], { animate: false });

    // Light gray base map, filtered to dark grey land / light grey water
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16,
      className: 'base-map-tile'
    }).addTo(map);

    // Red pinpoint for 526 Township Line Road, Blue Bell, PA
    const redPinSvg = encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36"><path fill="#ff0000" stroke="#8b0000" stroke-width="2" d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24c0-6.6-5.4-12-12-12z"/><circle fill="#8b0000" cx="12" cy="12" r="4"/></svg>');
    const redPinIcon = L.icon({
      iconUrl: 'data:image/svg+xml;charset=UTF-8,' + redPinSvg,
      iconSize: [24, 36],
      iconAnchor: [12, 36],
      popupAnchor: [0, -36]
    });

    L.marker([OFFICE_LAT, OFFICE_LON], { icon: redPinIcon })
      .addTo(map)
      .bindPopup('526 Township Line Road<br>Blue Bell, PA');

    let radarLayers = [];
    let radarFrameIndex = 0;
    let radarInterval = null;

    async function initRadar() {
      try {
        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        if (!res.ok) throw new Error('Radar API error');
        const data = await res.json();
        const frames = data.radar.past;
        if (!frames || frames.length === 0) throw new Error('No radar frames');

        const host = data.host;
        radarLayers = frames.map((frame, idx) => {
          const layer = L.tileLayer(host + frame.path + '/512/{z}/{x}/{y}/2/1_1.png', {
            opacity: 0,
            zIndex: 200,
            className: 'radar-tile'
          }).addTo(map);
          layer._radarTime = new Date(frame.time * 1000);
          return layer;
        });

        // Show the most recent frame first
        radarFrameIndex = radarLayers.length - 1;
        radarLayers[radarFrameIndex].setOpacity(1.0);
        updateRadarTime();

        // Start animating automatically
        startRadarAnimation();
      } catch (err) {
        console.error(err);
        document.getElementById('radarTime').textContent = 'Radar unavailable';
      }
    }

    function updateRadarTime() {
      const layer = radarLayers[radarFrameIndex];
      if (!layer || !layer._radarTime) return;
      const timeStr = layer._radarTime.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });
      document.getElementById('radarTime').textContent = 'Radar: ' + timeStr;
    }

    function startRadarAnimation() {
      if (radarInterval) clearInterval(radarInterval);
      radarInterval = setInterval(() => {
        radarLayers[radarFrameIndex].setOpacity(0);
        radarFrameIndex = (radarFrameIndex + 1) % radarLayers.length;
        radarLayers[radarFrameIndex].setOpacity(1.0);
        updateRadarTime();
      }, RADAR_FRAME_DELAY_MS);
    }

    // ===== WEATHER SETUP =====
    function getWeatherInfo(code) {
      const map = {
        0:  { icon: '☀️', text: 'Clear sky' },
        1:  { icon: '🌤️', text: 'Mainly clear' },
        2:  { icon: '⛅', text: 'Partly cloudy' },
        3:  { icon: '☁️', text: 'Overcast' },
        45: { icon: '🌫️', text: 'Fog' },
        48: { icon: '🌫️', text: 'Rime fog' },
        51: { icon: '🌦️', text: 'Light drizzle' },
        53: { icon: '🌦️', text: 'Moderate drizzle' },
        55: { icon: '🌧️', text: 'Dense drizzle' },
        61: { icon: '🌧️', text: 'Slight rain' },
        63: { icon: '🌧️', text: 'Moderate rain' },
        65: { icon: '🌧️', text: 'Heavy rain' },
        71: { icon: '🌨️', text: 'Slight snow' },
        73: { icon: '🌨️', text: 'Moderate snow' },
        75: { icon: '❄️', text: 'Heavy snow' },
        77: { icon: '🌨️', text: 'Snow grains' },
        80: { icon: '🌦️', text: 'Rain showers' },
        81: { icon: '🌧️', text: 'Moderate showers' },
        82: { icon: '⛈️', text: 'Heavy showers' },
        85: { icon: '🌨️', text: 'Snow showers' },
        86: { icon: '❄️', text: 'Heavy snow showers' },
        95: { icon: '⛈️', text: 'Thunderstorm' },
        96: { icon: '⛈️', text: 'Thunderstorm & hail' },
        99: { icon: '⛈️', text: 'Severe thunderstorm' }
      };
      return map[code] || { icon: '❓', text: 'Unknown' };
    }

    function getWindDirection(deg) {
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    let currentCityIndex = 0;
    let weatherData = {};

    async function fetchWeather(city) {
      const url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=' + city.lat +
        '&longitude=' + city.lon +
        '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&temperature_unit=fahrenheit' +
        '&wind_speed_unit=mph' +
        '&precipitation_unit=inch' +
        '&timezone=auto';
      const res = await fetch(url);
      if (!res.ok) throw new Error('Weather API error for ' + city.name);
      return await res.json();
    }

    async function loadAll() {
      let failed = [];
      for (const city of cities) {
        try {
          weatherData[city.name] = await fetchWeather(city);
        } catch (e) {
          console.error(e);
          failed.push(city.name);
        }
      }

      if (failed.length === cities.length) {
        document.getElementById('currentPanel').innerHTML =
          '<div class="error loading">Could not load weather data.<br>Check internet connection.</div>';
        return;
      }

      renderCurrent();
      renderTicker();
      document.getElementById('updateTime').textContent =
        'Updated: ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function renderCurrent() {
      const city = cities[currentCityIndex];
      const data = weatherData[city.name];
      if (!data) return;

      const current = data.current;
      const info = getWeatherInfo(current.weather_code);
      const windDir = getWindDirection(current.wind_direction_10m);
      const pressureInHg = (current.surface_pressure * 0.02953).toFixed(2);

      document.getElementById('currentPanel').innerHTML =
        '<div class="city-name">' + city.name + '</div>' +
        '<div class="city-state">' + city.state + ' — Currently</div>' +
        '<div class="temp-main">' + Math.round(current.temperature_2m) + '°</div>' +
        '<div class="condition">' + info.icon + ' ' + info.text + '</div>' +
        '<div class="detail-row"><span class="detail-label">Feels Like</span><span>' + Math.round(current.apparent_temperature) + '°</span></div>' +
        '<div class="detail-row"><span class="detail-label">Wind</span><span>' + Math.round(current.wind_speed_10m) + ' mph ' + windDir + '</span></div>' +
        '<div class="detail-row"><span class="detail-label">Humidity</span><span>' + current.relative_humidity_2m + '%</span></div>' +
        '<div class="detail-row"><span class="detail-label">Pressure</span><span>' + pressureInHg + '"</span></div>';
    }

    function renderTicker() {
      const ticker = document.getElementById('forecastTicker');
      let html = '';

      for (const city of cities) {
        const data = weatherData[city.name];
        if (!data) continue;

        const days = data.daily;
        let daysHtml = '';
        for (let i = 0; i < 7; i++) {
          const date = new Date(days.time[i] + 'T00:00:00');
          const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
          const info = getWeatherInfo(days.weather_code[i]);
          daysHtml +=
            '<div class="forecast-day">' +
              '<div class="forecast-day-name">' + dayName + '</div>' +
              '<div class="forecast-icon">' + info.icon + '</div>' +
              '<div class="forecast-temps">' +
                '<div class="forecast-high">' + Math.round(days.temperature_2m_max[i]) + '°</div>' +
                '<div class="forecast-low">' + Math.round(days.temperature_2m_min[i]) + '°</div>' +
              '</div>' +
            '</div>';
        }

        html +=
          '<div class="forecast-card">' +
            '<div class="forecast-city">' + city.name + ', ' + city.state + '</div>' +
            '<div class="forecast-days">' + daysHtml + '</div>' +
          '</div>';
      }

      ticker.innerHTML = html;
    }

    // Rotate featured city every 10 seconds
    setInterval(() => {
      currentCityIndex = (currentCityIndex + 1) % cities.length;
      renderCurrent();
    }, 10000);

    // Initial load and periodic refresh every 10 minutes
    loadAll();
    setInterval(loadAll, 600000);

    // Start radar
    initRadar();

    // ===== NWS WEATHER STORY IMAGE ROTATION =====
    // Cycles between live radar and all NWS Weather Story tab images every 30 seconds.
    // Images are scraped daily at 7:30 AM EST by a GitHub Actions workflow.
    let wxImages = [];
    let wxImageIndex = 0;

    async function loadWeatherStoryManifest() {
      try {
        const res = await fetch('assets/weatherstory-manifest.json?t=' + Date.now());
        if (!res.ok) throw new Error('Manifest not found');
        wxImages = await res.json();
        console.log('Loaded Weather Story images:', wxImages.length);
      } catch (err) {
        console.warn('Could not load Weather Story manifest:', err);
        wxImages = [];
      }
    }

    function cycleWxImages() {
      const overlay = document.getElementById('wxImageOverlay');
      const img = document.getElementById('wxImage');
      const label = document.getElementById('wxImageLabel');

      // If an image is currently shown, fade back to radar
      if (overlay.classList.contains('visible')) {
        overlay.classList.remove('visible');
        return;
      }

      // If no images are available, stay on radar
      if (!wxImages || wxImages.length === 0) {
        return;
      }

      // Try to preload the next Weather Story image before showing it
      const wxImg = wxImages[wxImageIndex];
      const preload = new Image();

      preload.onload = () => {
        img.src = preload.src;
        img.alt = wxImg.label || 'Weather Story';
        label.textContent = wxImg.label || '';
        overlay.classList.add('visible');
      };

      preload.onerror = () => {
        // Image missing or broken — stay on radar and try the next image next cycle
        console.warn('Weather Story image not available, staying on radar:', wxImg.src);
      };

      // Always advance to the next image for the following cycle
      wxImageIndex = (wxImageIndex + 1) % wxImages.length;
      preload.src = wxImg.src + '?t=' + Date.now();
    }

    // Load the manifest first, then start cycling
    loadWeatherStoryManifest();
    setInterval(cycleWxImages, 30000);

    // Auto-reload the entire page every 10 minutes
    setTimeout(() => {
      location.reload();
    }, 600000);
  </script>
</body>
</html>
